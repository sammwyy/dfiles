[package]
name = "dfiles"
version = "0.1.0"
edition = "2021"
authors = ["Sammwy"]
license = "Apache-2.0"
description = "A native, system-integrated file explorer for Linux"
repository = "https://github.com/sammwyy/dfiles"
homepage = "https://github.com/sammwyy/dfiles"
readme = "README.md"
keywords = ["file-manager", "file-explorer", "native", "xdg", "portal"]
categories = ["filesystem", "gui"]

[[bin]]
name = "dfiles"
path = "src/main.rs"

[dependencies]
dbus = "0.9"
url = "2"
libc = "0.2"
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
delib = { version = "0.1.0", path = "../delib" }
creamui-image = { path = "../creamui/crates/image", features = ["svg"] }
creamui-core = { path = "../creamui/crates/core" }
creamui-reactive = { path = "../creamui/crates/reactive" }
creamui-render = { path = "../creamui/crates/render", features = ["platform-wayland", "system-theme", "platform-window-integration-blair", "platform-blur-blair", "platform-blur-kwin"] }
creamui-theme = { path = "../creamui/crates/theme" }
creamui-theme-loader = { path = "../creamui/crates/theme-loader" }
creamui-fonts = { path = "../creamui/crates/fonts" }
creamui-widgets = { path = "../creamui/crates/widgets" }

[dev-dependencies]
tempfile = "3"
